<footer class="site-footer">
  <p class="footer-copy">&copy; {{ now.Format "2006" }} Daniel Ohnesorge</p>
  <nav class="footer-links" aria-label="Footer links">
    <a href="{{ "index.xml" | relURL }}">RSS</a>
    {{ with site.Params.social.github }}<a href="{{ . }}" rel="me noopener" target="_blank">GitHub</a>{{ end }}
    {{ with site.Params.social.x }}<a href="{{ . }}" rel="me noopener" target="_blank">X</a>{{ end }}
    {{ with site.Params.social.linkedin }}<a href="{{ . }}" rel="me noopener" target="_blank">LinkedIn</a>{{ end }}
  </nav>
</footer>
{{ $js := resources.Get "js/site.js" | minify | fingerprint }}
<script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" defer></script>

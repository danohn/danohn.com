<!doctype html>
<html lang="{{ site.Language.Locale | default "en" }}">

    {{ partial "header.html" . }}
    <div class="shell">
      <main class="main-content" id="main">
        <div class="content-body">
          {{ block "main" . }}{{ end }}
        </div>
        {{ partial "footer.html" . }}
      </main>
    </div>
    {{ partial "search.html" . }}
  </body>
</html>

{{ define "main" }}
  <section class="intro page-intro">
    <h1 class="page-heading">{{ .Title }}</h1>
  </section>
  {{ if eq .Kind "taxonomy" }}
    <section class="post-index">
      <div class="post-list">
      {{ range .Pages }}
        <article class="post-row term-row">
          <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
          <span>{{ len .Pages }} {{ cond (eq (len .Pages) 1) "post" "posts" }}</span>
        </article>
      {{ end }}
      </div>
    </section>
  {{ else }}
    <section class="post-summaries" aria-label="Posts">
      <div class="post-summary-list">
        {{ range .Pages }}
          {{ partial "post-summary.html" . }}
        {{ end }}
      </div>
    </section>
  {{ end }}
{{ end }}
